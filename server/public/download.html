<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Companion — Download</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site" data-page="download"></header>
<main>
  <section class="hero" style="padding-top:30px">
    <div>
      <h1 data-i18n="dlTitle"></h1>
      <p class="lead" data-i18n="dlSub"></p>
      <div class="ctas"><a class="btn primary big" id="dl" href="/download/latest"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span data-i18n="dlButton"></span></a></div>
      <p class="small" id="ver"></p>
      <p class="small" id="sha" style="word-break:break-all"></p>
    </div>
    <img class="shot" src="/img/home.png" alt="">
  </section>
  <section class="section">
    <h2 data-i18n="reqTitle"></h2>
    <div class="req" style="margin-top:14px">
      <div><b data-i18n="req1t"></b><span class="muted" data-i18n="req1p"></span></div>
      <div><b data-i18n="req2t"></b><span class="muted" data-i18n="req2p"></span></div>
      <div><b data-i18n="req3t"></b><span class="muted" data-i18n="req3p"></span></div>
    </div>
  </section>
  <section class="section">
    <h2 data-i18n="howTitle"></h2>
    <div class="steps3" style="margin-top:14px">
      <div><h3 data-i18n="s1t"></h3><p data-i18n="s1p"></p></div>
      <div><h3 data-i18n="s2t"></h3><p data-i18n="s2p"></p></div>
      <div><h3 data-i18n="s3t"></h3><p data-i18n="s3p"></p></div>
    </div>
  </section>
  <section class="section">
    <div class="card" id="log-help"><h2 data-i18n="logHelpTitle"></h2>
      <ol class="muted" style="margin:6px 0 0 20px;line-height:1.9">
        <li data-i18n="logHelp1"></li><li data-i18n="logHelp2"></li><li data-i18n="logHelp3"></li><li data-i18n="logHelp4"></li>
      </ol>
      <p class="muted" style="margin-top:10px" data-i18n="logHelpPath"></p>
      <code style="display:block;margin-top:6px;background:var(--panel2);padding:8px 10px;border-radius:8px;font-size:13px;word-break:break-all">C:\Program Files (x86)\Steam\steamapps\common\Torchlight Infinite\UE_game\TorchLight\Saved\Logs\UE_game.log</code>
      <p class="muted" style="margin-top:10px" data-i18n="logHelpOther"></p>
    </div>
    <div class="card"><h2 data-i18n="smartTitle"></h2><p class="muted" data-i18n="smartText"></p></div>

  </section>
  <section class="section" id="patch-notes">
    <h2 data-i18n="pnTitle"></h2>
    <div id="pnList" class="pn"></div>
  </section>
</main>
<footer class="site"></footer>
<script src="/layout.js"></script>
<script src="/common.js"></script>
<script src="/download.js"></script>
</body>
</html>
