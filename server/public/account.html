<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Companion — Account</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main style="max-width:760px">
  <div class="pagehead"><h1><span data-i18n="accTitle"></span> <span class="soon" data-i18n="accSub"></span></h1></div>

    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" disabled style="opacity:.55;cursor:not-allowed">Discord</button>
      <a class="btn primary" href="/download" data-i18n="downloadWin"></a>
    </div>
  </div>

<footer class="site"></footer>
<script src="/layout.js"></script>
<script src="/common.js"></script>

</html>
